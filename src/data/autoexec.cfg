// ============================================================
// CS2 AUTOEXEC.CFG
// Target: Ryzen 7 5800X3D + RTX 3060 Ti @ 1280x1080
// Last updated: 2026
// NOTE: All commands below verified against the live CS2 build.
//       Nine CS:GO-era commands were removed because the console
//       reported them as "Unknown command" (Source 2 replaced the
//       systems they controlled). They are listed at the bottom.
// ============================================================

// ==================== NETWORK ====================
// Only two network commands actually work in CS2.
// cl_interp, cl_interp_ratio, cl_updaterate, cl_cmdrate were all
// REMOVED by Valve in 2024 (sub-tick handles this now). Do NOT use them.

rate 1000000                               // Max bandwidth accepted from server (~6.2 Mbps). Safe on fast broadband.
cl_net_buffer_ticks 0                      // No network buffering = lowest latency. Set to 1 if you see packet loss.

// ==================== CPU / VISUAL LOAD REDUCTION ====================
// These still exist and reduce per-frame CPU/GPU workload.

cl_disable_ragdolls 1                      // Disable ragdoll physics on dead bodies. Major CPU saver in busy rounds.
r_drawtracers_firstperson 1                // Show first-person bullet tracers (1 = shown, 0 = hidden). Preference trivial cost.
cl_particle_fallback_multiplier 5          // Force simpler particle fallbacks. Cuts CPU particle load (smokes/fire).

// ==================== BACKGROUND PROFILERS ====================
// Diagnostic tools that consume CPU cycles silently.

vprof_off                                  // Disable VProf visual profiler. Frees CPU cycles.
iv_off                                     // Disable interpolation-variable profiler.
demo_flush 0                               // Don't flush demo data to disk each update. Reduces background disk I/O.

// ==================== SOUND ====================
snd_mixahead 0.05                          // 50 ms audio buffer. Balances audio latency vs CPU headroom.

// ==================== WATER / MAP EFFECTS ====================
r_csgo_water_effects false                 // Disable reflective/animated water. GPU saving on water maps (Ancient, etc.).
r_csgo_water_refraction false              // Disable water refraction distortion. Additional GPU saving.

// ==================== HUD / UI ====================
cl_autohelp 0                              // Disable contextual game hints. UI only.
cl_hide_avatar_images 1                    // Don't load Steam avatars. Prevents avatar-download stutter.
cl_allow_animated_avatars false            // Disable animated profile pictures. Minor UI saving.
hud_scaling 0                              // Smallest HUD scale. Cosmetic.
cl_hud_radar_scale 1                       // Radar size within the HUD. Cosmetic.
cl_hud_radar_background_alpha 1            // Radar background opacity. Cosmetic.
cl_radar_scale 0.4                         // Map zoom on radar (0.4 shows more of the map). Preference.
cl_radar_always_centered false             // Radar shows whole map instead of centring on you. Better awareness.
r_show_build_info false                    // Hide the build-info watermark. Cosmetic.
r_fullscreen_gamma 2.2                       // In-game gamma (LOWER = brighter). 3 is dark 1.6-1.8 lifts shadowed areas.
cl_teamid_overhead_fade_near_crosshair 1

// ==================== HAND / VIEWMODEL ====================
// cl_righthand was removed then replaced. Use switchhands (toggle) or
// cl_prefer_lefthanded for a permanent default.
cl_prefer_lefthanded false                 // Permanent right-hand default (replaces old cl_righthand 1).
viewmodel_presetpos 2
viewmodel_fov 68                           // Viewmodel field of view.
viewmodel_offset_x 2.5                     // Viewmodel horizontal offset.
viewmodel_offset_y 2                       // Viewmodel forward/back offset.
viewmodel_offset_z -2                    // Viewmodel vertical offset.

// ==================== BINDS ====================
bind "mwheeldown" "+jump"                  // Jump on scroll-down (bhop assist).
bind "space" "+jump"                       // Jump on spacebar.
bind "mouse4" "switchhands"                // Toggle weapon hand (CS2-native, works).

// ==================== SENSITIVITY ====================
sensitivity 0.88

// ==================== CROSSHAIR ====================
cl_crosshairstyle 4
cl_crosshair_thickness 2
cl_crosshair_drawoutline 0
cl_crosshaircolor_r 0
cl_crosshaircolor_g 255
cl_crosshaircolor_b 0
cl_crosshaircolor_a 255
cl_crosshair_length 5
cl_crosshair_gap 2
cl_crosshairdot 0
cl_crosshair_t 0

//EXTRAS
cl_crosshair_recoil 0
cl_crosshair_sniper_width 3
cl_crosshair_friendly_warning 1
hud_showtargetid 1
cl_ironsight_dot_scale 2
cl_ironsight_usecrosshaircolor 1

// ==================== FPS CONSISTENCY ====================
fps_max 0
engine_low_latency_sleep_after_client_tick true   // Aligns engine sleep with Reflex for smoother frametimes.
engine_no_focus_sleep 0                    // Don't throttle the engine when the window briefly loses focus.

// ==================== MONITORING ====================
// Toggle these from the in-game telemetry settings when diagnosing.
// cl_hud_telemetry_frametime_show 2       // Real-time frametime graph. Best stutter diagnostic (watch spikes).
// cl_hud_telemetry_ping_show 2            // Always-visible ping.

// ==================== CONFIRMATION ====================
echo ""
echo "=== autoexec loaded (5800X3D config) ==="
echo ""